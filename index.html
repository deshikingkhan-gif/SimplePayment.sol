<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Arc Testnet Gateway</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #080a10; color: #e2e8f0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; position: relative; overflow: hidden; }
    
    /* Background Gradient Elements */
    body::before { content: ""; position: absolute; width: 300px; height: 300px; background: rgba(56, 189, 248, 0.15); filter: blur(100px); top: -50px; left: -50px; border-radius: 50%; z-index: -1; }
    body::after { content: ""; position: absolute; width: 400px; height: 400px; background: rgba(14, 165, 233, 0.1); filter: blur(120px); bottom: -100px; right: -100px; border-radius: 50%; z-index: -1; }

    .app-container { width: 100%; max-width: 480px; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.06); border-radius: 24px; padding: 32px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
    .header { text-align: center; margin-bottom: 32px; }
    .header h2 { font-size: 26px; color: #fff; font-weight: 700; background: linear-gradient(135deg, #fff 0%, #a1a1aa 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header p { color: #94a3b8; font-size: 14px; margin-top: 4px; }
    
    .card { background: rgba(10, 15, 30, 0.4); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 16px; padding: 20px; margin-bottom: 18px; position: relative; transition: 0.3s; }
    .card:hover { border-color: rgba(56, 189, 248, 0.3); }
    .card-title { font-size: 13px; color: #64748b; margin-bottom: 14px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; display: flex; justify-content: space-between; align-items: center; }
    
    .input-group { position: relative; margin-bottom: 12px; }
    input { width: 100%; background: #0a1120; border: 1px solid #1e293b; padding: 14px 16px; border-radius: 10px; color: #fff; font-size: 14px; outline: none; transition: 0.2s; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15); }
    input::placeholder { color: #475569; }

    .btn { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%); color: #fff; border: none; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: 0.3s; position: relative; overflow: hidden; }
    .btn:hover { box-shadow: 0 10px 20px -5px rgba(14, 165, 233, 0.4); transform: translateY(-1px); }
    .btn:active { transform: translateY(1px); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
    .btn-secondary { background: #1e293b; color: #f1f5f9; border: 1px solid #334155; }
    .btn-secondary:hover { background: #334155; }
    .btn-danger { background: linear-gradient(135deg, #dc2626 0%, #ef4444 100%); }
    .btn-danger:hover { box-shadow: 0 10px 20px -5px rgba(239, 68, 68, 0.4); }

    .status-badge { font-size: 11px; padding: 4px 10px; border-radius: 20px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 700; text-transform: uppercase; }
    .status-badge.connected { background: rgba(34, 197, 94, 0.1); color: #4ade80; border-color: rgba(34, 197, 94, 0.2); }
    .balance-text { font-size: 28px; font-weight: 700; color: #fff; text-align: center; margin-top: 10px; }
    .balance-currency { font-size: 14px; color: #94a3b8; font-weight: 600; vertical-align: middle; margin-left: 6px; }
    .address-display { font-size: 12px; color: #475569; text-align: center; margin-top: 10px; background: rgba(0,0,0,0.2); padding: 8px; border-radius: 8px; border: 1px solid #1e293b; font-family: monospace; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h2>Arc Network Gateway</h2>
    <p>Premium Smart Contract Payment Platform</p>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Wallet Status</span>
      <span id="badge" class="status-badge">Disconnected</span>
    </div>
    <button id="btnConnect" class="btn" onclick="connectWallet()">Connect MetaMask</button>
    <p id="walletAddress" class="address-display">No wallet connected</p>
  </div>

  <div class="card">
    <div class="card-title"><span>Send Payment</span></div>
    <div class="input-group">
      <input type="text" id="reference" placeholder="Reference ID (e.g., Order #101)">
    </div>
    <div class="input-group">
      <input type="number" id="amount" placeholder="Amount (ETH/Token)" step="0.001" min="0.0001">
    </div>
    <button id="btnPay" class="btn" onclick="sendPayment()">Submit Secure Payment</button>
  </div>

  <div class="card">
    <div class="card-title"><span>Contract Total Balance</span></div>
    <p id="contractBalance" class="balance-text">0.00<span class="balance-currency">Token</span></p>
    <button class="btn btn-secondary" style="margin-top: 15px;" onclick="checkBalance()">Refresh Balance</button>
  </div>

  <div class="card" style="border-color: rgba(239, 68, 68, 0.2);">
    <div class="card-title"><span style="color: #ef4444;">Admin Panel</span></div>
    <button id="btnWithdraw" class="btn btn-danger" onclick="withdraw()">Withdraw All Funds</button>
  </div>
</div>

<script>
  const contractAddress = "0xAbd514B4aA7f9A09C71b138D7EF66D0ad345d075";
  const contractABI = [
    "function pay(string memory _reference) external payable",
    "function getBalance() external view returns (uint256)",
    "function withdrawAll() external"
  ];

  let provider, signer, contract;

  async function connectWallet() {
    if (!window.ethereum) return alert("Please install MetaMask!");
    try {
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      const address = await signer.getAddress();
      
      document.getElementById("walletAddress").innerText = address.substring(0, 10) + "..." + address.substring(address.length - 8);
      const badge = document.getElementById("badge");
      badge.innerText = "Connected";
      badge.classList.add("connected");
      
      contract = new ethers.Contract(contractAddress, contractABI, signer);
      checkBalance();
    } catch (e) {
      console.error(e);
      alert("Failed to connect wallet!");
    }
  }

  async function sendPayment() {
    if (!contract) return alert("Please connect your wallet first!");
    const ref = document.getElementById("reference").value.trim();
    const amount = document.getElementById("amount").value;

    if (!ref || !amount || parseFloat(amount) <= 0) {
      return alert("Please enter a valid reference ID and amount!");
    }

    const btnPay = document.getElementById("btnPay");
    try {
      btnPay.disabled = true;
      btnPay.innerText = "Processing Transaction...";

      const tx = await contract.pay(ref, { value: ethers.utils.parseEther(amount) });
      await tx.wait();

      alert("Payment successful!");
      document.getElementById("reference").value = "";
      document.getElementById("amount").value = "";
      checkBalance();
    } catch (e) {
      console.error(e);
      alert("Transaction failed!");
    } finally {
      btnPay.disabled = false;
      btnPay.innerText = "Submit Secure Payment";
    }
  }

  async function checkBalance() {
    if (!contract) return;
    try {
      const balance = await contract.getBalance();
      const formattedBalance = ethers.utils.formatEther(balance);
      document.getElementById("contractBalance").innerHTML = parseFloat(formattedBalance).toFixed(2) + '<span class="balance-currency">Token</span>';
    } catch (e) { 
      console.error(e); 
    }
  }

  async function withdraw() {
    if (!contract) return alert("Please connect your wallet first!");
    const btnWithdraw = document.getElementById("btnWithdraw");
    try {
      btnWithdraw.disabled = true;
      btnWithdraw.innerText = "Withdrawing...";

      const tx = await contract.withdrawAll();
      await tx.wait();

      alert("Funds withdrawn successfully!");
      checkBalance();
    } catch (e) {
      console.error(e);
      alert("Only the contract owner can withdraw funds!");
    } finally {
      btnWithdraw.disabled = false;
      btnWithdraw.innerText = "Withdraw All Funds";
    }
  }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arc Testnet Payment Gateway</title>
    <!-- Ethers.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f6f8; }
        .card { background: white; padding: 20px; border-radius: 8px; max-width: 500px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #0056b3; }
        .danger-btn { background-color: #dc3545; }
        .danger-btn:hover { background-color: #a71d2a; }
        .status { word-break: break-all; font-weight: bold; color: #28a745; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Arc Network Payment Gateway</h2>
        <button onclick="connectWallet()">MetaMask ওয়ালেট কানেক্ট করুন</button>
        <p id="walletAddress">ওয়ালেট: কানেক্ট করা হয়নি</p>
    </div>

    <div class="card">
        <h3>পেমেন্ট পাঠান (pay)</h3>
        <input type="text" id="reference" placeholder="পেমেন্ট রেফারেন্স (যেমন: Order #101)">
        <input type="number" id="amount" placeholder="পরিমাণ (Native Token)" step="0.001">
        <button onclick="sendPayment()">পেমেন্ট সম্পন্ন করুন</button>
    </div>

    <div class="card">
        <h3>কন্ট্রাক্ট ব্যালেন্স (getBalance)</h3>
        <button onclick="checkBalance()">ব্যালেন্স রিফ্রেশ করুন</button>
        <p id="contractBalance">মোট ব্যালেন্স: 0 ETH/Token</p>
    </div>

    <div class="card">
        <h3>তহবিল তুলুন (withdrawAll)</h3>
        <p><small>* শুধুমাত্র কন্ট্রাক্ট ওনার এই অপশনটি ব্যবহার করতে পারবেন</small></p>
        <button class="danger-btn" onclick="withdraw()">সব ফান্ড ওনার ওয়ালেটে তুলুন</button>
    </div>

    <script>
        // GitHub README অনুযায়ী Arc Testnet Deployed Address
        const contractAddress = "0xAbd514B4aA7f9A09C71b138D7EF66D0ad345d075";
        
        // PaymentGateway.sol-এর ABI
        const contractABI = [
            "function pay(string memory _reference) external payable",
            "function getBalance() external view returns (uint256)",
            "function withdrawAll() external"
        ];

        let provider;
        let signer;
        let contract;

        // ১. MetaMask ওয়ালেট কানেক্ট করা
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("eth_requestAccounts", []);
                    signer = provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "ওয়ালেট: " + address;
                    
                    contract = new ethers.Contract(contractAddress, contractABI, signer);
                    checkBalance();
                } catch (error) {
                    alert("ওয়ালেট কানেক্ট করতে ব্যর্থ হয়েছে!");
                }
            } else {
                alert("দয়া করে ব্রাউজারে MetaMask ইনস্টল করুন!");
            }
        }

        // ২. pay() ফাংশন ব্যবহার করে পেমেন্ট করা
        async function sendPayment() {
            if (!contract) return alert("প্রথমে ওয়ালেট কানেক্ট করুন!");
            
            const ref = document.getElementById("reference").value;
            const ethAmount = document.getElementById("amount").value;
            
            if (!ref || !ethAmount) return alert("রেফারেন্স এবং টাকার পরিমাণ সঠিকভাবে দিন");

            try {
                const tx = await contract.pay(ref, {
                    value: ethers.utils.parseEther(ethAmount)
                });
                alert("ট্রানজ্যাকশন প্রসেস হচ্ছে... অনুগ্রহ করে অপেক্ষা করুন।");
                await tx.wait();
                alert("পেমেন্ট সফলভাবে সম্পন্ন হয়েছে!");
                checkBalance();
            } catch (error) {
                console.error(error);
                alert("পেমেন্ট ব্যর্থ হয়েছে!");
            }
        }

        // ৩. getBalance() দিয়ে ব্যালেন্স চেক করা
        async function checkBalance() {
            if (!contract) return;
            try {
                const balance = await contract.getBalance();
                const ethBalance = ethers.utils.formatEther(balance);
                document.getElementById("contractBalance").innerText = "মোট ব্যালেন্স: " + ethBalance + " Token";
            } catch (error) {
                console.error(error);
            }
        }

        // ৪. withdrawAll() ফাংশন দিয়ে ওনারের ফান্ড তোলা
        async function withdraw() {
            if (!contract) return alert("প্রথমে ওয়ালেট কানেক্ট করুন!");
            
            try {
                const tx = await contract.withdrawAll();
                alert("ফান্ড উত্তোলনের কাজ চলছে...");
                await tx.wait();
                alert("সমস্ত ফান্ড সফলভাবে ওনার ওয়ালেটে পৌঁছেছে!");
                checkBalance();
            } catch (error) {
                console.error(error);
                alert("ত্রুটি: শুধুমাত্র কন্ট্রাক্টের আসল ওনার এই ফান্ড তুলতে পারবেন।");
            }
        }
    </script>
</body>
</html>

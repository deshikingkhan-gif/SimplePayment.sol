<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arc Testnet Payment Gateway</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .app-container { width: 100%; max-width: 450px; background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); }
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 22px; color: #38bdf8; margin-bottom: 4px; }
    .card { background: rgba(15, 23, 42, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    .card-title { font-size: 14px; color: #94a3b8; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; text-transform: uppercase; letter-spacing: 0.5px; }
    input { width: 100%; background: #0f172a; border: 1px solid #334155; padding: 12px 14px; border-radius: 8px; color: #fff; font-size: 14px; margin-bottom: 10px; outline: none; transition: 0.2s; }
    input:focus { border-color: #38bdf8; box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2); }
    .btn { width: 100%; background: linear-gradient(90deg, #0284c7, #0369a1); color: #fff; border: none; padding: 12px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn-danger { background: linear-gradient(90deg, #dc2626, #b91c1c); }
    .status-badge { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 600; }
    .status-badge.connected { background: rgba(34, 197, 94, 0.1); color: #22c55e; border-color: rgba(34, 197, 94, 0.2); }
    .balance-text { font-size: 22px; font-weight: 700; color: #f3f4f6; text-align: center; margin-top: 8px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="header">
    <h2>Arc Network Gateway</h2>
    <p style="color: #64748b; font-size: 13px;">Smart Contract Payment Platform</p>
  </div>

  <div class="card">
    <div class="card-title">
      <span>Wallet Status</span>
      <span id="badge" class="status-badge">Disconnected</span>
    </div>
    <button id="btnConnect" class="btn" onclick="connectWallet()">Connect MetaMask</button>
    <p id="walletAddress" style="font-size: 12px; color: #94a3b8; text-align: center; margin-top: 8px;"></p>
  </div>

  <div class="card">
    <div class="card-title"><span>Send Payment</span></div>
    <input type="text" id="reference" placeholder="Reference ID (e.g., Order #101)">
    <input type="number" id="amount" placeholder="Amount (ETH/Token)" step="0.001" min="0.0001">
    <button id="btnPay" class="btn" onclick="sendPayment()">Submit Payment</button>
  </div>

  <div class="card">
    <div class="card-title"><span>Contract Total Balance</span></div>
    <p id="contractBalance" class="balance-text">0.00 Token</p>
    <button class="btn" style="background: #1e293b; margin-top: 10px; border: 1px solid #334155;" onclick="checkBalance()">Refresh Balance</button>
  </div>

  <div class="card">
    <div class="card-title"><span style="color: #ef4444;">Admin Panel</span></div>
    <button id="btnWithdraw" class="btn btn-danger" onclick="withdraw()">Withdraw All Funds</button>
  </div>
</div>

<script>
  const contractAddress = "0xAbd514B4aA7f9A09C71b138D7EF66D0ad345d075";
  const contractABI = [
    "function pay(string memory _reference) external payable",
    "function getBalance() external view returns (uint256)",
    "function withdrawAll() external"
  ];

  let provider, signer, contract;

  async function connectWallet() {
    if (!window.ethereum) return alert("Please install MetaMask!");
    try {
      provider = new ethers.providers.Web3Provider(window.ethereum);
      await provider.send("eth_requestAccounts", []);
      signer = provider.getSigner();
      const address = await signer.getAddress();
      
      document.getElementById("walletAddress").innerText = address.substring(0, 6) + "..." + address.substring(address.length - 4);
      const badge = document.getElementById("badge");
      badge.innerText = "Connected";
      badge.classList.add("connected");
      
      contract = new ethers.Contract(contractAddress, contractABI, signer);
      checkBalance();
    } catch (e) {
      console.error(e);
      alert("Failed to connect wallet!");
    }
  }

  async function sendPayment() {
    if (!contract) return alert("Please connect your wallet first!");
    const ref = document.getElementById("reference").value.trim();
    const amount = document.getElementById("amount").value;

    if (!ref || !amount || parseFloat(amount) <= 0) {
      return alert("Please enter a valid reference ID and amount!");
    }

    const btnPay = document.getElementById("btnPay");
    try {
      btnPay.disabled = true;
      btnPay.innerText = "Processing Transaction...";

      const tx = await contract.pay(ref, { value: ethers.utils.parseEther(amount) });
      await tx.wait();

      alert("Payment successful!");
      document.getElementById("reference").value = "";
      document.getElementById("amount").value = "";
      checkBalance();
    } catch (e) {
      console.error(e);
      alert("Transaction failed!");
    } finally {
      btnPay.disabled = false;
      btnPay.innerText = "Submit Payment";
    }
  }

  async function checkBalance() {
    if (!contract) return;
    try {
      const balance = await contract.getBalance();
      document.getElementById("contractBalance").innerText = ethers.utils.formatEther(balance) + " Token";
    } catch (e) { 
      console.error(e); 
    }
  }

  async function withdraw() {
    if (!contract) return alert("Please connect your wallet first!");
    const btnWithdraw = document.getElementById("btnWithdraw");
    try {
      btnWithdraw.disabled = true;
      btnWithdraw.innerText = "Withdrawing...";

      const tx = await contract.withdrawAll();
      await tx.wait();

      alert("Funds withdrawn successfully!");
      checkBalance();
    } catch (e) {
      console.error(e);
      alert("Only the contract owner can withdraw funds!");
    } finally {
      btnWithdraw.disabled = false;
      btnWithdraw.innerText = "Withdraw All Funds";
    }
  }
</script>
</body>
</html>
